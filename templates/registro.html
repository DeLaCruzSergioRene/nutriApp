{% extends 'base.html' %}
{% block titulo %}Regístrate{% endblock %}
{% block contenido %}
<div class="container">
<h2 class="text-center mb-4">Crea tu Cuenta</h2>
<form method="POST" action="{{ url_for('registrame') }}" class="formulario-card">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Tu Nombre" value="{{ nombre or '' }}">
        </div>
        <div class="col-md-6 mb-3">
            <label for="apellidos" class="form-label">Apellidos:</label>
            <input type="text" class="form-control" id="apellidos" name="apellidos" required placeholder="Tus Apellidos" value="{{ apellidos or '' }}">
        </div>
    </div>

    <label class="form-label">Fecha de Nacimiento:</label>
    <div class="row mb-3">
        <div class="col-4"><input type="number" class="form-control" name="dia" required min="1" max="31" placeholder="Día"></div>
        <div class="col-4"><input type="number" class="form-control" name="mes" required min="1" max="12" placeholder="Mes"></div>
        <div class="col-4"><input type="number" class="form-control" name="anio" required min="1900" max="2024" placeholder="Año"></div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="genero" class="form-label">Género:</label>
            <select class="form-select" id="genero" name="genero" required>
                <option value="" disabled selected>Selecciona tu género</option>
                <option value="H">Hombre</option>
                <option value="M">Mujer</option>
                <option value="O">Otro</option>
                <option value="P">Prefiero no decir</option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label for="actFisica" class="form-label">Nivel de Actividad Física:</label>
            <select class="form-select" id="actFisica" name="actFisica" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="N">No</option>
                <option value="Y">Sí</option>
            </select>
        </div>
    </div>
    
    <hr class="my-4">
    <h5 class="text-center mb-3">Tus Metas (Opcional)</h5>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="objetivo" class="form-label">Objetivo Principal:</label>
            <input type="text" class="form-control" id="objetivo" name="objetivo" placeholder="Ej: Bajar 5kg, aumentar músculo">
        </div>
        <div class="col-md-6 mb-3">
            <label for="dieta" class="form-label">Tipo de Dieta:</label>
            <!-- name="dieta" -->
            <input type="text" class="form-control" id="dieta" name="dieta" placeholder="Ej: Vegana, Keto, Mediterránea">
        </div>
    </div>
    
    <div class="mb-4">
        <label for="alergias" class="form-label">Alergias o Restricciones Alimentarias:</label>
        <textarea class="form-control" id="alergias" name="alergias" rows="2" placeholder="Ej: Lactosa, gluten, frutos secos"></textarea>
    </div>

    <hr class="my-4">
    <h5 class="text-center mb-3">Datos de Acceso</h5>
    <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico:</label>
        <input type="email" class="form-control" id="email" name="email" required placeholder="tu.correo@ejemplo.com" value="{{ email or '' }}">
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="contrasena" class="form-label">Contraseña:</label>
            <input type="password" class="form-control" id="contrasena" name="contrasena" required placeholder="Mínimo 8 caracteres">
        </div>
        <div class="col-md-6 mb-4">
            <label for="confirmar_contrasena" class="form-label">Confirma Contraseña:</label>
            <input type="password" class="form-control" id="confirmar_contrasena" name="confirmar_contrasena" required placeholder="Repite la contraseña">
        </div>
    </div>

    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg btn-registro">Crear Cuenta</button>
    </div>
    <p class="text-center mt-3">¿Ya tienes cuenta? <a href="{{ url_for('sesion') }}">Inicia Sesión</a>.</p>
</form>
</div>
{% endblock %}
