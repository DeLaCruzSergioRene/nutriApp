{% extends 'base.html' %}
{% block title %}Peso Ideal{% endblock %}
{% block contenido %}

<h1 class="mb-4 text-center bg-secondary text-white p-2">Calculadora de Peso Corporal Ideal</h1>
<form action="{{ url_for('calculadora_idea') }}" method="POST">
    <div class="mb-3">
        <label class="form-label">Sexo:</label>
        <select name="genero" class="form-select" required>
            <option value="...">...</option>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
            <option value="privacidad">Prefiero no decirlo</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Altura (cm):</label>
        <input type="number" step="0.1" class="form-control" name="altura" placeholder="Introduce tu altura en cm" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2">Calcular</button>
</form>

{% if resultado %}
    <h2 class="mt-4">Resultado</h2>
    <table class="table table-bordered">
        <tbody>
            <tr>
                <th>Peso ideal (kg)</th>
                <td><strong>{{ resultado }}</strong></td>
            </tr>
        </tbody>
    </table>
{% endif %}
{% endblock %}
