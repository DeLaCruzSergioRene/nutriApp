{% extends 'base.html' %}
{% block title %}Calculadora TMB{% endblock %}
{% block contenido %}

<h1 class="mb-4 text-center bg-secondary text-white p-2">Calculadora de Tasa Metabólica Basal (TMB)</h1>
<form action="{{ url_for('calcular_tmb') }}" method="POST">
    <div class="mb-3">
        <label class="form-label">Sexo:</label>
        <select name="genero" class="form-select" required>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Peso (kg):</label>
        <input type="number" step="0.1" class="form-control" name="peso" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Altura (cm):</label>
        <input type="number" step="0.1" class="form-control" name="altura" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Edad:</label>
        <input type="number" class="form-control" name="edad" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2">Calcular</button>
</form>

{% if resultado %}
    <h2 class="mt-4">Resultado</h2>
    <table class="table table-bordered">
        <tbody>
            <tr>
                <th>TMB (kcal/día)</th>
                <td><strong>{{ resultado }}</strong></td>
            </tr>
        </tbody>
    </table>
{% endif %}

{% endblock %}
